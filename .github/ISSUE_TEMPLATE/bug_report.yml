name: Bug report
description: Something in Claudette behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your access token, credential JSON, or session log
        contents into this issue. Nothing in here should need them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hover the notch
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claudette version
      description: Shown at the bottom of the Settings window.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "15.2, MacBook Pro 14in M3"
    validations:
      required: true
  - type: dropdown
    id: notch
    attributes:
      label: Does the display have a notch?
      options: ["Yes", "No", "Multiple displays, mixed"]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or a short screen recording help a lot for visual issues.

      <circle cx="172" cy="16" r="4" fill="#0B0E11" stroke="#060809" stroke-width="1.6"/>

      <!-- Settings gear -->
      <g stroke="#7C8794" stroke-width="1.4" stroke-linecap="round">
        <circle cx="322" cy="16" r="4.2" fill="none"/>
        <circle cx="322" cy="16" r="1.4" fill="#7C8794" stroke="none"/>
        <path d="M322 9.6 V11 M322 21 V22.4 M315.6 16 H317 M327 16 H328.4 M317.5 11.5 L318.5 12.5 M325.5 19.5 L326.5 20.5 M326.5 11.5 L325.5 12.5 M318.5 19.5 L317.5 20.5"/>

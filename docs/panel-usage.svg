<svg width="420" height="270" viewBox="0 0 420 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="desk" cx="0.24" cy="-0.1" r="1.3">
      <stop stop-color="#2A3A47"/>
      <stop offset="0.52" stop-color="#17212B"/>
      <stop offset="1" stop-color="#0E151C"/>
    </radialGradient>
    <linearGradient id="sparkfade" x1="0" y1="148" x2="0" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F26A46" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F26A46" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panelclip">
      <path d="M0 0 H344 V194 A14 14 0 0 1 330 208 H14 A14 14 0 0 1 0 194 Z"/>
    </clipPath>
    <filter id="panelshadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Desktop -->
  <rect width="420" height="270" fill="url(#desk)"/>

  <!-- Expanded panel: 344pt wide, bottom corner radius 14, hanging from the notch -->
  <g transform="translate(38,0)">
    <path d="M0 0 H344 V194 A14 14 0 0 1 330 208 H14 A14 14 0 0 1 0 194 Z" fill="#000000" filter="url(#panelshadow)"/>

    <g clip-path="url(#panelclip)">
